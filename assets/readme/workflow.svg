  <path d="M835 311 L843 317 L835 323" fill="none" stroke="#b98b44" stroke-width="3"/>
  <rect x="850" y="269" width="294" height="95" rx="13" fill="#e2eaf2" stroke="#a9bece" stroke-width="2"/>
  <text x="871" y="307" font-size="23" font-weight="700" fill="#1c3647" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">GPU attention</text>
  <text x="871" y="337" font-size="19" fill="#536f80" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Tiled computation</text>
</svg>
