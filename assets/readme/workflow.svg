<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="396" viewBox="0 0 1200 396" role="img" aria-labelledby="title desc">
  <title id="title">How DraftKV retrieves and streams historical KV</title>
  <desc id="desc">A query chunk is geometrically grounded against the GPU-resident Persistent Draft Bank; draft block relevance refines the candidates. Selected blocks guide tile-wise transfers from full-resolution CPU KV memory to GPU attention.</desc>
  <rect width="1200" height="396" rx="22" fill="#f3f6fa"/>
  <text x="56" y="55" font-size="22" font-weight="700" fill="#193244" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">01 / RETRIEVE</text>
  <text x="276" y="55" font-size="20" fill="#566b7d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Compact descriptors remain resident on the GPU</text>
  <rect x="56" y="86" width="188" height="94" rx="13" fill="#e2eaf2" stroke="#a9bece" stroke-width="2"/>
  <text x="74" y="124" font-size="22" font-weight="650" fill="#1c3647" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Query chunk</text>
  <text x="74" y="151" font-size="19" fill="#536f80" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Current views</text>
  <path d="M248 133 H283" stroke="#157e78" stroke-width="3"/>
  <path d="M276 127 L283 133 L276 139" fill="none" stroke="#157e78" stroke-width="3"/>
  <rect x="289" y="86" width="262" height="94" rx="13" fill="#e5f5f1" stroke="#79b9ae" stroke-width="2"/>
  <text x="310" y="123" font-size="23" font-weight="700" fill="#164f4b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Draft Grounding</text>
  <text x="310" y="151" font-size="19" fill="#43756f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Geometry candidates</text>
  <path d="M555 133 H588" stroke="#157e78" stroke-width="3"/>
  <path d="M581 127 L588 133 L581 139" fill="none" stroke="#157e78" stroke-width="3"/>
  <rect x="593" y="86" width="257" height="94" rx="13" fill="#e5f5f1" stroke="#79b9ae" stroke-width="2"/>
  <text x="614" y="123" font-size="23" font-weight="700" fill="#164f4b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Draft Refinement</text>
  <text x="614" y="151" font-size="19" fill="#43756f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Block-level scores</text>
  <path d="M854 133 H887" stroke="#157e78" stroke-width="3"/>
  <path d="M880 127 L887 133 L880 139" fill="none" stroke="#157e78" stroke-width="3"/>
  <rect x="894" y="86" width="250" height="94" rx="13" fill="#d6e5ed" stroke="#96b3c4" stroke-width="2"/>
  <text x="912" y="123" font-size="22" font-weight="700" fill="#19394c" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Selected KV blocks</text>
  <text x="912" y="151" font-size="18" fill="#526f81" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Relevant history</text>
  <path d="M1019 180 V205 H729 V239" fill="none" stroke="#bf914b" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round"/>
  <path d="M723 232 L729 240 L735 232" fill="none" stroke="#bf914b" stroke-width="3"/>
  <text x="56" y="236" font-size="22" font-weight="700" fill="#193244" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">02 / STREAM</text>
  <text x="264" y="236" font-size="20" fill="#566b7d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Transfer only selected full-resolution KV tiles</text>
  <rect x="56" y="269" width="272" height="95" rx="13" fill="#fff4df" stroke="#dfb977" stroke-width="2"/>
  <text x="75" y="307" font-size="23" font-weight="700" fill="#704b1e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">CPU historical KV</text>
  <text x="75" y="337" font-size="19" fill="#8c6b39" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Full-resolution memory</text>
  <path d="M332 317 H382" stroke="#b98b44" stroke-width="3"/>
  <path d="M374 311 L382 317 L374 323" fill="none" stroke="#b98b44" stroke-width="3"/>
  <rect x="388" y="269" width="411" height="95" rx="13" fill="#fff4df" stroke="#dfb977" stroke-width="2"/>
  <text x="408" y="306" font-size="23" font-weight="700" fill="#704b1e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Streaming CG-Attention</text>
  <text x="408" y="336" font-size="19" fill="#8c6b39" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Overlap H2D transfer and attention</text>
